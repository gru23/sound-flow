<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Account Verified | SoundFlow</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Inter, Arial, sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background:
                    linear-gradient(
                            135deg,
                            #141e30,
                            #243b55
                    );
            color: white;
        }

        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 45px;
            text-align: center;
            width: 420px;
            box-shadow:
                    0 20px 50px rgba(0,0,0,.35);
        }

        .icon {
            width: 90px;
            height: 90px;
            margin: auto;
            border-radius: 50%;
            background: #22c55e;

            display:flex;
            justify-content:center;
            align-items:center;

            font-size:50px;
        }

        h1 {
            margin-top:25px;
            font-size:32px;
        }

        p {
            color:#d1d5db;
            font-size:16px;
            line-height:1.6;
        }

    </style>
</head>

<body>

<div class="card">

    <div class="icon">
        ✓
    </div>

    <h1>
        Account verified
    </h1>

    <p>
        Your SoundFlow account has been successfully verified.
        You can now log in through the mobile application and start editing your tracks.
    </p>

</div>

</body>
</html>
