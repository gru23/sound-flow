<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password | SoundFlow</title>

    <style>

        * {
            box-sizing: border-box;
            font-family: Inter, Arial, sans-serif;
        }

        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                    135deg,
                    #141e30,
                    #243b55
            );

            color: white;
        }

        .card {

            width: 430px;

            padding: 45px;

            border-radius: 24px;

            background: rgba(255,255,255,.08);

            backdrop-filter: blur(12px);

            box-shadow: 0 20px 50px rgba(0,0,0,.35);

            text-align: center;
        }

        .icon {

            width: 90px;
            height: 90px;

            margin: auto;

            border-radius: 50%;

            background: #3b82f6;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 42px;
        }

        h1 {
            margin-top: 25px;
            margin-bottom: 10px;
            font-size: 30px;
        }

        p {

            color: #d1d5db;

            margin-bottom: 30px;

            line-height: 1.6;
        }

        input {

            width: 100%;

            padding: 14px;

            margin-bottom: 18px;

            border: none;

            border-radius: 12px;

            font-size: 15px;
        }

        button {

            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 12px;

            cursor: pointer;

            font-size: 16px;

            font-weight: bold;

            background: #3b82f6;

            color: white;

            transition: .25s;
        }

        button:hover {
            background: #2563eb;
        }

        #message {

            margin-top: 20px;

            font-size: 15px;

            color: #d1d5db;
        }

        .success {
            color: #22c55e !important;
        }

        .error {
            color: #ef4444 !important;
        }

    </style>

</head>

<body>

<div class="card">

    <div class="icon">
        🔒
    </div>

    <h1>Reset password</h1>

    <p>
        Enter your new password below.
    </p>

    <input
            id="password"
            type="password"
            placeholder="New password"
    >

    <button onclick="resetPassword()">
        Change password
    </button>

    <div id="message"></div>

</div>

<script>

    async function resetPassword() {

        const params = new URLSearchParams(window.location.search);

        const token = params.get("token");

        const password = document.getElementById("password").value;

        const message = document.getElementById("message");

        if (!password) {

            message.className = "error";
            message.innerText = "Please enter a new password.";

            return;
        }

        try {

            const response = await fetch("/auth/reset-confirm", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    token: token,
                    newPassword: password

                })

            });

            if (response.ok) {

                message.className = "success";
                message.innerText =
                    "Password changed successfully. You can now log in using the SoundFlow mobile application.";

            } else {

                const text = await response.text();

                message.className = "error";
                message.innerText = text || "Unable to change password.";

            }

        } catch (e) {

            message.className = "error";
            message.innerText = "Network error.";

        }

    }

</script>

</body>
</html>
