<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verification Failed | SoundFlow</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#3f0d12,#a71d31);
            color:white;
        }

        .card {
            background:rgba(255,255,255,0.1);
            backdrop-filter:blur(10px);
            border-radius:24px;
            padding:40px;
            width:420px;
            text-align:center;
        }

        .icon {
            width:90px;
            height:90px;
            margin:auto;
            border-radius:50%;
            background:#ef4444;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:50px;
        }

        h1 {
            margin-top:25px;
        }

        p {
            color:#ddd;
            line-height:1.6;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">
        ✕
    </div>

    <h1>
        Verification failed
    </h1>

    <p>
        This verification link is invalid or has expired.
        Please request a new verification email.
    </p>

</div>

</body>
</html>
